<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kognia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 class="logo">KOGNIA</h1>
    </header>

    <main class="container">
      <section class="cards">
        <article class="card" id="card-chat">
          <div class="card-header">
            <div class="bot-icon" aria-hidden="true">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="7" width="18" height="10" rx="5" stroke="currentColor" stroke-width="1.5" />
                <circle cx="8" cy="12" r="1.5" fill="currentColor" />
                <circle cx="16" cy="12" r="1.5" fill="currentColor" />
                <path d="M12 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                <path d="M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
              </svg>
            </div>
            <h2>Chat Bot</h2>
          </div>

          <div class="chat-upload">
            <input type="file" id="doc-input" accept=".txt,.md,.json,.pdf" />
            <label for="doc-input" class="btn accent">Subir documento</label>
            <button id="view-pdf-btn" class="btn primary" type="button">Ver PDF</button>
            <span id="doc-status" class="doc-status"></span>
          </div>

          <div class="chat-options">
            <label for="doc-select">Documento</label>
            <select id="doc-select">
              <option value="">Todos</option>
            </select>
          </div>

          <div id="pdf-viewer" class="pdf-viewer" hidden>
            <div class="pdf-controls">
              <button id="pdf-prev" class="btn accent" type="button">Anterior</button>
              <span id="pdf-page-info" class="doc-status"></span>
              <button id="pdf-next" class="btn accent" type="button">Siguiente</button>
            </div>
            <canvas id="pdf-canvas"></canvas>
          </div>

          <div class="chat-window" id="chat-window">
            <div class="messages" id="messages"></div>
            <div class="chat-input">
              <input id="user-input" type="text" placeholder="Escribe tu mensaje..." autocomplete="off" />
              <button id="send-btn" class="btn primary" type="button">Enviar</button>
            </div>
          </div>
        </article>
      </section>

      <section class="cards footer">
        <article class="card" id="card-info">
          <h2>Información</h2>
          <p>
            Bienvenido a Kognia. Explora el asistente legal y conversa con el Chat Bot.
            Puedes subir un documento de texto o PDF para que el bot use su contenido en la conversación.
          </p>
        </article>
      </section>

      
    </main>

    <script src="https://unpkg.com/pdfjs-dist@3.11.60/build/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.60/build/pdf.worker.min.js";
      }
    </script>
    <script src="script.js"></script>
  </body>
</html>
